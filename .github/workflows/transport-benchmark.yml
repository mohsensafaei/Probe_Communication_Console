name: TCP integrity and 1 ms timing benchmark
on:
  push:
    branches: [linux, windows]
    paths:
      - 'source/benchmarks/**'
      - 'source/probe/engine.py'
      - 'source/probe/scenario.py'
      - 'source/probe/timing.py'
      - 'source/probe/recording.py'
      - 'source/probe/processing.py'
      - '.github/workflows/transport-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ${{ github.ref_name == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Real sockets, capture integrity and sequence jitter
        run: python benchmarks/transport_benchmark.py --output transport-benchmark.json
      - name: Compare packet capture bindings on Linux loopback
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libpcap0.8t64
          python -m venv "$RUNNER_TEMP/pcap-ab"
          "$RUNNER_TEMP/pcap-ab/bin/python" -m pip install libpcap==1.11.0b29
          sudo env PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/pcap-ab/bin/python" benchmarks/pcap_binding_benchmark.py --live lo --output pcap-binding-benchmark.json
      - name: Sweep buffer requests and polling on Linux loopback
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          sudo env PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/pcap-ab/bin/python" benchmarks/pcap_binding_benchmark.py --live lo --tune-live --packets 4000 --output pcap-tuning-benchmark.json
      - name: Upload measured results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Probe-transport-benchmark-${{ github.ref_name }}
          path: |
            source/transport-benchmark.json
            source/pcap-binding-benchmark.json
            source/pcap-tuning-benchmark.json
          if-no-files-found: error
