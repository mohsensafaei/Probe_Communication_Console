name: Windows tests and portable builds
on:
  push:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source
    env:
      CI: 'true'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Source launcher and real I/O diagnostics
        shell: cmd
        run: |
          set "PROBE_PYTHON=%pythonLocation%\python.exe"
          call start_windows.bat --self-test
      - name: Models, transports, captures and timed sequences
        run: .windows-venv/Scripts/python.exe -m unittest discover -s tests -v
      - name: Native Tk GUI, Test lab and Appearance removal
        run: .windows-venv/Scripts/python.exe -m unittest discover -s tests -p ui_smoke.py -v
      - name: Build folder bundle
        shell: cmd
        run: |
          set "PROBE_PYTHON=%pythonLocation%\python.exe"
          call build_windows.bat
      - name: Build single executable
        shell: cmd
        run: |
          set "PROBE_PYTHON=%pythonLocation%\python.exe"
          call build_windows.bat --onefile
      - name: Verify extracted ZIPs including frozen GUI and Test lab
        run: .windows-venv/Scripts/python.exe verify_bundle.py dist/Probe-windows-x64.zip dist/Probe-windows-x64-onefile.zip
      - name: Upload verified portable Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Probe-windows-x64
          path: source/dist/Probe-windows-x64*.zip
          if-no-files-found: error
          retention-days: 30
