name: TCP integrity and 1 ms timing benchmark
on:
  push:
    branches: [linux, windows]
    paths:
      - 'source/benchmarks/**'
      - '.github/workflows/transport-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ${{ github.ref_name == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: source
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Real sockets, capture integrity and sequence jitter
        run: python benchmarks/transport_benchmark.py --output transport-benchmark.json
      - name: Upload measured results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Probe-transport-benchmark-${{ github.ref_name }}
          path: source/transport-benchmark.json
          if-no-files-found: error
