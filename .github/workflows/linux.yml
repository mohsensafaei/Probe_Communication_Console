name: Linux tests and portable build
on:
  push:
    branches: [linux]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Tk and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv xvfb xauth
      - name: Install pinned dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Backend and Linux PTY tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Native Tk GUI
        run: xvfb-run -a .venv/bin/python -m unittest discover -s tests -p ui_smoke.py -v
      - name: Real transport diagnostics
        run: .venv/bin/python run_probe.py --self-test
      - name: Capture native UI previews
        run: |
          .venv/bin/python -m pip install pillow==11.3.0
          xvfb-run -a -s "-screen 0 1400x1000x24" .venv/bin/python tests/visual_preview.py
      - name: Upload UI previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Probe-interface-previews
          path: source/probe-preview-*.png
          if-no-files-found: error
      - name: Build native portable package
        run: .venv/bin/python build_portable.py
      - name: Verify extracted portable runtime and GUI
        run: xvfb-run -a .venv/bin/python verify_bundle.py dist/Probe-linux-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Probe-linux-x86_64
          path: source/dist/Probe-linux-*.zip
          if-no-files-found: error
